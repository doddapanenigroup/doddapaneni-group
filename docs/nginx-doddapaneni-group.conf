# Nginx config for Doddapaneni Group (Next.js on port 3000)
# Copy to: /etc/nginx/sites-available/doddapaneni-group
# Replace yourdomain.com with your domain or remove server_name for IP-only.
# Enable: ln -s /etc/nginx/sites-available/doddapaneni-group /etc/nginx/sites-enabled/
#
# HTTPS (VPS / full server with Nginx):
#   1. Point DNS A/AAAA records for yourdomain.com and www to this server.
#   2. Install certbot (e.g. Ubuntu: apt install certbot python3-certbot-nginx).
#   3. Obtain cert: sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#   Certbot usually patches this file; paths below are the typical Let's Encrypt layout.
#
# App env: set NEXTAUTH_URL=https://yourdomain.com (and AUTH_URL if you use it) so
# Auth.js issues cookies and redirects for HTTPS.

# Redirect HTTP -> HTTPS (use after SSL is installed; comment out if you only use HTTP temporarily)
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tell Next.js the original request was HTTPS (important for Auth.js / secure cookies)
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}
